name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir -p www
          cp index.html logic.js observe.js speed.js deep.js business.js www/
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap init MindForge com.mindforge.game --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mindforge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
