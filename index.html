<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindForge</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:16px}
button{display:block;width:100%;margin:8px 0;padding:14px;font-size:20px;border:0;border-radius:10px;background:#2a6;color:#fff}
button.b{background:#555}
#qt{font-size:26px;margin:20px 0}
#tm{color:#fc3;font-size:20px}
</style></head><body>
<h2>MindForge</h2><div id="app"></div>
<script>
window.GAMES=[];
const TYPES={logic:"Logic",observe:"Observation",speed:"Speed",deep:"Deep",business:"Business"};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function diff(l){return l<=30?l:30+(l-30)*0.5}
let timed=false,cur=null,lvl=1,q=0,right=0,times=[],t0=0,cq=null,tm=null;
function ui(h){document.getElementById("app").innerHTML=h}
function key(g){return "mf_"+g.type+"_"+g.name}
function getLvl(g){return +(localStorage.getItem(key(g))||1)}
function home(){
 ui(Object.keys(TYPES).map(t=>"<button onclick=\"openType('"+t+"')\">"+TYPES[t]+" ("+GAMES.filter(g=>g.type==t).length+"/10 games)</button>").join("")+
 "<button class='b' onclick='toggleTimed()'>Timed mode: "+(timed?"ON":"OFF")+"</button>");
}
function toggleTimed(){timed=!timed;home()}
function openType(t){
 let list=GAMES.filter(g=>g.type==t);
 ui("<h3>"+TYPES[t]+"</h3>"+(list.length?list.map(g=>"<button onclick='play("+GAMES.indexOf(g)+")'>"+g.name+" - Level "+getLvl(g)+"</button>").join(""):"<p>Games jaldi aayenge</p>")+"<button class='b' onclick='home()'>Peeche</button>");
}
function play(i){cur=GAMES[i];lvl=getLvl(cur);q=0;right=0;times=[];next()}
function next(){
 if(q==5){finish();return}
 cq=cur.make(diff(lvl));
 let o=cq.opts.slice().sort(()=>Math.random()-0.5);
 ui("<div>"+cur.name+" | Level "+lvl+(lvl<=3?" (Trial)":"")+" | Sawal "+(q+1)+"/5</div><div id='tm'></div><div id='qt'>"+cq.text+"</div>"+o.map(v=>"<button data-v='"+v+"' onclick='pick(this.dataset.v)'>"+v+"</button>").join(""));
 t0=Date.now();
 if(timed){
  let left=Math.max(3,Math.round(15-diff(lvl)*0.12));
  document.getElementById("tm").innerText="Time: "+left;
  tm=setInterval(function(){left--;document.getElementById("tm").innerText="Time: "+left;if(left<=0)pick(null)},1000);
 }
}
function pick(v){
 clearInterval(tm);
 times.push((Date.now()-t0)/1000);
 if(v!==null&&String(v)===String(cq.ans))right++;
 q++;next();
}
function finish(){
 let avg=(times.reduce((a,b)=>a+b,0)/5).toFixed(1),slow=Math.max(...times).toFixed(1);
 let up=right>=4;
 if(up)localStorage.setItem(key(cur),lvl+1);
 ui("<h3>Analysis</h3><div id='qt'>Sahi: "+right+"/5<br>Accuracy: "+(right*20)+"%<br>Average time: "+avg+" sec<br>Sabse slow: "+slow+" sec<br>"+(up?"Level pass!":"Pass hone ke liye 4 sahi chahiye")+"</div>"+
 "<button onclick='play("+GAMES.indexOf(cur)+")'>"+(up?"Agla Level":"Dobara Try")+"</button><button class='b' onclick='openType(\""+cur.type+"\")'>Games list</button>");
}
</script>
<script src="logic.js"></script>
<script src="observe.js"></script>
<script src="speed.js"></script>
<script src="deep.js"></script>
<script src="business.js"></script>
<script>home()</script>
</body></html>
