<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MindForge</title>
<style>
:root{--gold:#d4af37}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Roboto,sans-serif;color:#f3e9c6;background:radial-gradient(circle at 50% -10%,#2b2208 0,#0b0b10 45%,#050507 100%) fixed;padding:18px 16px 40px;text-align:center}
#app{perspective:900px;max-width:480px;margin:0 auto}
.lg{width:84px;height:84px;filter:drop-shadow(0 0 12px rgba(212,175,55,.55))}
.ttl{margin:8px 0 0;font-family:Georgia,serif;font-size:32px;letter-spacing:6px;background:linear-gradient(90deg,#8a6d1d,#f6e27a,#d4af37,#f6e27a,#8a6d1d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.tag{margin:2px 0 14px;font-size:11px;letter-spacing:4px;color:#a8924a}
@keyframes shine{to{background-position:200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(26px) rotateX(-25deg)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sp{padding-top:40px}
.lb{height:8px;border-radius:5px;background:#2a2515;overflow:hidden;margin:28px 10px 10px}
.lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a227,#f6e27a);transition:width .25s}
.sub{color:#a8924a;font-size:13px;margin-bottom:12px;letter-spacing:1px}
button,label{font-family:inherit;color:inherit;cursor:pointer;border:0}
.inp{width:100%;padding:16px;font-size:20px;border-radius:14px;border:1px solid rgba(212,175,55,.5);background:#14110a;color:#fff6d6;text-align:center;margin:14px 0;outline:none}
.dp{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #d4af37;box-shadow:0 0 18px rgba(212,175,55,.5);display:grid;place-items:center;background:#2a2008;font-size:34px;color:#f6e27a;flex:none}
.dp img{width:100%;height:100%;object-fit:cover}
.dp.big{width:150px;height:150px;margin:18px auto;font-size:60px}
.prof{display:flex;align-items:center;gap:16px;margin:6px 0 14px;text-align:left;animation:rise .5s both}
.pn{flex:1;min-width:0}
.pl{color:#9a9a9a;font-size:12px}
.rname{font-family:Georgia,serif;font-size:30px;font-weight:700;background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#4facfe,#c471f5,#ff5f6d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;word-break:break-word}
.rank{padding:12px 14px;border-radius:16px;background:linear-gradient(145deg,#1d1d1d,#101010);border:1px solid rgba(212,175,55,.3);margin-bottom:12px;text-align:left;animation:rise .55s both}
.rk{font-size:18px;font-weight:700;color:#f6e27a;margin-bottom:8px}
.xpb{height:8px;border-radius:5px;background:#2a2515;overflow:hidden}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#c9a227,#f6e27a)}
.rank small{color:#9a9a9a;font-size:11px;display:block;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sbox{padding:14px 6px 14px 12px;border-radius:16px;background:linear-gradient(145deg,#1d1d1d,#101010);border:1px solid rgba(255,255,255,.08);text-align:left;animation:rise .55s both;animation-delay:calc(var(--i) * .08s)}
.sbox small{display:block;color:#9a9a9a;font-size:11px}
.sbox b{font-size:24px}
.card{display:flex;align-items:center;gap:14px;width:100%;margin:12px 0;padding:16px 18px;text-align:left;border-radius:18px;border:1px solid rgba(212,175,55,.4);background:linear-gradient(145deg,#211c0e,#0e0d09);box-shadow:0 12px 26px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1),0 0 18px rgba(212,175,55,.08);transform-origin:50% 100%;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * .07s);transition:transform .15s}
.card:active{transform:translateY(4px) rotateX(8deg) scale(.98)}
.ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:radial-gradient(circle at 30% 20%,#3a2f0f,#15120a);border:1px solid rgba(212,175,55,.5)}
.tx{flex:1;display:flex;flex-direction:column}
.tx b{font-size:18px;color:#f6e27a;letter-spacing:.5px}
.tx small{color:#a8924a;font-size:12px;margin-top:2px}
.ar{font-size:26px;color:var(--gold)}
.pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#1a1403;background:linear-gradient(135deg,#f6e27a,#c9a227)}
.ghost{display:block;width:100%;margin:12px 0;padding:13px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.3);font-size:15px;color:#d9c577}
.ghost.small{width:auto;margin:18px auto 0;padding:8px 18px;font-size:13px}
.gold{display:block;width:100%;margin:14px 0;padding:16px;border-radius:16px;font-size:18px;font-weight:800;color:#1a1403;background:linear-gradient(135deg,#f6e27a,#d4af37 55%,#a8821d);box-shadow:0 10px 24px rgba(212,175,55,.35),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .15s}
.gold:active{transform:translateY(3px) scale(.98)}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.top b{font-family:Georgia,serif;font-size:19px;color:#f6e27a}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin:4px 2px 8px;min-height:22px}
.cmb{color:#ffc371;font-weight:700;font-size:14px}
.prog{height:6px;border-radius:4px;background:#2a2515;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#4facfe,#47e891);transition:width .3s}
.note{font-size:12px;color:#a8924a;margin-bottom:8px}
.bar{height:6px;border-radius:4px;background:#2a2515;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c9a227,#f6e27a)}
#tm{color:#f6e27a;font-size:14px;margin-bottom:8px}
.qcard{margin:12px 0 20px;padding:26px 16px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.45);box-shadow:0 18px 36px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.15);animation:rise .5s both;word-break:break-word}
.qcard.shake{animation:shake .4s}
#qt{font-size:25px;line-height:1.5;color:#fff6d6}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{padding:18px 8px;border-radius:16px;font-size:22px;font-weight:700;color:#f6e27a;background:linear-gradient(145deg,#241e0d,#0f0d07);border:1px solid rgba(212,175,55,.45);box-shadow:0 8px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);animation:rise .5s both;animation-delay:calc(var(--i) * .06s);transition:transform .12s}
.opt:active{transform:translateY(3px) scale(.97)}
.opt.ok{background:linear-gradient(145deg,#1f7a46,#0f4a2a);color:#fff;border-color:#4ade80;box-shadow:0 0 22px rgba(74,222,128,.55)}
.opt.bad{background:linear-gradient(145deg,#8a2230,#4a0f18);color:#fff;border-color:#f87171}
.stars{font-size:44px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 18px rgba(212,175,55,.6);margin:6px 0}
.res{font-family:Georgia,serif;font-size:26px;color:#f6e27a;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.st{padding:16px 8px;border-radius:16px;background:linear-gradient(145deg,#211c0e,#0e0d09);border:1px solid rgba(212,175,55,.35);animation:rise .55s both;animation-delay:calc(var(--i) * .08s)}
.st b{display:block;font-size:26px;color:#f6e27a}
.st small{color:#a8924a;font-size:12px}
.tip{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed rgba(212,175,55,.4);color:#f3e9c6;font-size:14px;margin:8px 0}
.cf{position:fixed;top:-16px;width:8px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
</style></head><body>
<div id="app"></div>
<script>
window.GAMES=[];
const TYPES={logic:["Logic","🧩"],observe:["Observation","👁️"],speed:["Speed","⚡"],deep:["Deep Thinking","🧠"],business:["Business","💼"]};
const RANKS=[["Bronze",0,"🥉"],["Silver",300,"🥈"],["Gold",1000,"🥇"],["Platinum",2500,"💠"],["Diamond",6000,"💎"],["Master",12000,"👑"]];
const LOGO=`<svg class="lg" viewBox="0 0 64 64"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e27a"/><stop offset="1" stop-color="#8a6d1d"/></linearGradient></defs><polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#0b0b10" stroke="url(#gg)" stroke-width="3"/><path d="M18 42V22l14 14 14-14v20" fill="none" stroke="url(#gg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function diff(l){if(l<=5)return l*0.6;if(l<=30)return 3+(l-5)*1.5;return 40.5+(l-30)*0.75}
function rankOf(x){var r=0;for(var i=0;i<RANKS.length;i++)if(x>=RANKS[i][1])r=i;return r}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function num(k){return +(localStorage.getItem(k)||0)}
function dayKey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function getStreak(){var l=localStorage.getItem("mf_last"),t=dayKey(new Date()),y=dayKey(new Date(Date.now()-864e5));return(l==t||l==y)?num("mf_streak"):0}
function touchStreak(){var l=localStorage.getItem("mf_last"),t=dayKey(new Date()),y=dayKey(new Date(Date.now()-864e5));if(l!=t){localStorage.setItem("mf_streak",l==y?num("mf_streak")+1:1);localStorage.setItem("mf_last",t)}}
let timed=false,cur=null,lvl=1,q=0,right=0,times=[],t0=0,cq=null,tm=null,busy=false,scr="splash",entered=false;
let trial=false,boss=false,qTotal=5,lives=0,maxLives=0,combo=0,bestCombo=0,xpGain=0,failed=false,useT=false;
let pname=localStorage.getItem("mf_name")||"",dp=localStorage.getItem("mf_dp")||"";
function ui(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
function key(g){return "mf_"+g.type+"_"+g.name}
function getLvl(g){return +(localStorage.getItem(key(g))||1)}

/* ---------- Awaaz (code se bani, koi file nahi) ---------- */
let AC=null,mg=null,mt=null,musicOn=localStorage.getItem("mf_music")!=="0",sfxOn=localStorage.getItem("mf_sfx")!=="0";
function ensureAC(){
 if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0.5;mg.connect(AC.destination)}
 if(AC.state=="suspended")AC.resume();
}
function tone(f,d,ty,v){
 var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
 o.type=ty;o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,n);
 g.gain.exponentialRampToValueAtTime(v,n+0.03);
 g.gain.exponentialRampToValueAtTime(0.0001,n+d);
 o.connect(g);g.connect(mg);o.start(n);o.stop(n+d+0.05);
}
function seq(a){a.forEach(function(n){setTimeout(function(){try{tone(n[0],n[1],n[2],n[3])}catch(e){}},n[4])})}
function sfx(k){
 if(!sfxOn)return;
 try{
  ensureAC();
  if(k=="ok")seq([[660,.12,"triangle",.25,0],[880,.18,"triangle",.25,90]]);
  else if(k=="combo")seq([[784,.1,"triangle",.28,0],[1046,.1,"triangle",.28,80],[1318,.2,"triangle",.28,160]]);
  else if(k=="bad")seq([[200,.2,"sawtooth",.18,0],[140,.35,"sawtooth",.18,120]]);
  else if(k=="tick")seq([[1000,.05,"square",.08,0]]);
  else if(k=="win")seq([[523,.18,"triangle",.28,0],[659,.18,"triangle",.28,140],[784,.18,"triangle",.28,280],[1046,.4,"triangle",.3,420]]);
  else if(k=="lose")seq([[392,.25,"sawtooth",.15,0],[330,.25,"sawtooth",.15,220],[262,.5,"sawtooth",.15,440]]);
  else if(k=="boss")seq([[98,.8,"sawtooth",.2,0],[131,.8,"sawtooth",.2,300]]);
  else if(k=="tap")seq([[600,.06,"square",.06,0]]);
 }catch(e){}
}
function vib(p){if(sfxOn&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("button,label")&&!e.target.closest(".opt"))sfx("tap")});
function startMusic(){
 try{
  if(!musicOn)return;
  ensureAC();
  if(mt)return;
  var mel=[0,3,7,10,7,3,0,-2,0,3,7,12,10,7,3,7],bs=[0,-4,-2,-5],i=0;
  mt=setInterval(function(){
   tone(220*Math.pow(2,mel[i%16]/12),0.5,"triangle",0.08);
   if(i%4==0)tone(110*Math.pow(2,bs[Math.floor(i/4)%4]/12),1.6,"sine",0.14);
   i++;
  },420);
 }catch(e){}
}
function stopMusic(){if(mt){clearInterval(mt);mt=null}}
function toggleMusic(){musicOn=!musicOn;localStorage.setItem("mf_music",musicOn?"1":"0");if(musicOn)startMusic();else stopMusic();home(true)}
function toggleSfx(){sfxOn=!sfxOn;localStorage.setItem("mf_sfx",sfxOn?"1":"0");home(true)}
document.addEventListener("visibilitychange",function(){if(document.hidden)stopMusic();else if(entered)startMusic()});
function confetti(){
 var cl=["#f6e27a","#ff5f6d","#47e891","#4facfe","#c471f5"];
 for(var i=0;i<40;i++){
  var d=document.createElement("div");d.className="cf";
  d.style.left=(Math.random()*100)+"vw";d.style.background=cl[i%5];
  d.style.animationDuration=(2+Math.random()*2)+"s";d.style.animationDelay=(Math.random()*0.6)+"s";
  document.body.appendChild(d);
  (function(x){setTimeout(function(){x.remove()},4800)})(d);
 }
}

/* ---------- Back button ---------- */
function push(s){
 if(s=="play"&&(scr=="play"||scr=="end"))history.replaceState({s:s},"");
 else history.pushState({s:s},"");
 scr=s;
}
window.addEventListener("popstate",function(){
 clearInterval(tm);busy=false;
 if(scr=="play"||scr=="end")openType(cur.type,true);
 else if(scr=="type")home(true);
});

/* ---------- Intro, naam, photo ---------- */
function splash(){
 scr="splash";
 ui("<div class='sp'>"+LOGO+"<h1 class='ttl'>MINDFORGE</h1><p class='tag'>TRAIN · THINK · WIN</p><div class='lb' id='lbw'><i id='lbi'></i></div><div id='lt' class='sub'>Loading...</div></div>");
 var p=0,msgs=["Dimag garam ho raha hai...","Games taiyaar ho rahe hain...","Levels load ho rahe hain...","Bas ek second..."];
 var iv=setInterval(function(){
  var b=document.getElementById("lbi"),t=document.getElementById("lt");
  if(!b){clearInterval(iv);return}
  p+=4+Math.random()*6;if(p>100)p=100;
  b.style.width=p+"%";t.innerText=msgs[Math.min(3,Math.floor(p/26))];
  if(p>=100){
   clearInterval(iv);
   setTimeout(function(){
    var w=document.getElementById("lbw");if(!w)return;
    w.style.display="none";t.style.display="none";
    document.querySelector(".sp").insertAdjacentHTML("beforeend","<button class='gold' style='margin-top:36px' onclick='enter()'>▶ TAP TO ENTER</button>");
   },300);
  }
 },180);
}
function enter(){entered=true;startMusic();if(pname)home(true);else askName()}
function askName(){
 scr="onboard";
 ui("<div class='sp'>"+LOGO+"<h2 class='res'>Tumhara naam kya hai?</h2><input id='nm' class='inp' maxlength='16' placeholder='Apna naam likho' value=\""+esc(pname)+"\"><button class='gold' onclick='saveName()'>Aage ›</button></div>");
}
function saveName(){
 var e=document.getElementById("nm"),v=e.value.trim();
 if(!v){e.focus();return}
 pname=v;localStorage.setItem("mf_name",v);askPhoto();
}
function dpHTML(){return dp?"<img src='"+dp+"'>":"<span>"+esc((pname||"?").charAt(0).toUpperCase())+"</span>"}
function askPhoto(){
 scr="onboard";
 ui("<div class='sp'><h2 class='res'>Apni photo lagao</h2><div class='dp big' id='dpv'>"+dpHTML()+"</div><label class='ghost' for='fi'>📷 Gallery se photo chuno</label><input id='fi' type='file' accept='image/*' style='display:none' onchange='pickDP(this)'><button class='gold' onclick='home(true)'>Shuru karo ›</button><button class='ghost small' onclick='home(true)'>Abhi skip karo</button></div>");
}
function pickDP(inp){
 var f=inp.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  var im=new Image();
  im.onload=function(){
   var c=document.createElement("canvas");c.width=c.height=256;
   var x=c.getContext("2d"),s=Math.min(im.width,im.height);
   x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);
   dp=c.toDataURL("image/jpeg",0.85);
   try{localStorage.setItem("mf_dp",dp)}catch(e){}
   var v=document.getElementById("dpv");if(v)v.innerHTML=dpHTML();
  };
  im.src=r.result;
 };
 r.readAsDataURL(f);
}

/* ---------- Home, types, games ---------- */
function home(np){
 scr="home";
 var passed=num("mf_passed"),qs=num("mf_qs"),rt=num("mf_right"),acc=qs?Math.round(rt*100/qs):0;
 var xp=num("mf_xp"),ri=rankOf(xp),nx=RANKS[ri+1],pct=nx?Math.round((xp-RANKS[ri][1])*100/(nx[1]-RANKS[ri][1])):100;
 ui("<div class='prof'><div class='dp'>"+dpHTML()+"</div><div class='pn'><div class='pl'>Player</div><div class='rname'>"+esc(pname||"Player")+"</div></div></div>"+
 "<div class='rank'><div class='rk'>"+RANKS[ri][2]+" "+RANKS[ri][0]+"</div><div class='xpb'><i style='width:"+pct+"%'></i></div><small>"+xp+" XP"+(nx?" · agla rank "+nx[1]+" XP par":" · MAX rank")+"</small></div>"+
 "<div class='stats'><div class='sbox' style='--i:0'><small>Levels pass</small><b style='color:#47e891'>"+passed+"</b></div><div class='sbox' style='--i:1'><small>Streak 🔥</small><b style='color:#ff9f43'>"+getStreak()+"</b></div><div class='sbox' style='--i:2'><small>Accuracy</small><b style='color:#ffc371'>"+acc+"%</b></div></div>"+
 Object.keys(TYPES).map(function(t,i){
  var c=GAMES.filter(function(g){return g.type==t}).length;
  return "<button class='card' style='--i:"+i+"' onclick=\"openType('"+t+"')\"><span class='ic'>"+TYPES[t][1]+"</span><span class='tx'><b>"+TYPES[t][0]+"</b><small>"+c+"/10 games</small></span><span class='ar'>›</span></button>"}).join("")+
 "<button class='card' style='--i:5' onclick='playMix()'><span class='ic'>🎲</span><span class='tx'><b>Mix Challenge</b><small>Random game, random type</small></span><span class='ar'>›</span></button>"+
 "<button class='ghost' onclick='toggleTimed()'>⏱ Timed mode: <b>"+(timed?"ON":"OFF")+"</b> (Level 20 ke baad apne aap ON)</button>"+
 "<button class='ghost' onclick='toggleMusic()'>🎵 Music: <b>"+(musicOn?"ON":"OFF")+"</b></button>"+
 "<button class='ghost' onclick='toggleSfx()'>🔊 Awaaz aur vibration: <b>"+(sfxOn?"ON":"OFF")+"</b></button>"+
 "<button class='ghost' onclick='askName()'>✎ Naam / photo badlo</button>");
}
function toggleTimed(){timed=!timed;home(true)}
function openType(t,np){
 if(!np)push("type");
 scr="type";
 var list=GAMES.filter(function(g){return g.type==t});
 ui("<div class='top'><b>"+TYPES[t][1]+" "+TYPES[t][0]+"</b></div>"+
 (list.length?list.map(function(g,i){var l=getLvl(g);return "<button class='card' style='--i:"+i+"' onclick='play("+GAMES.indexOf(g)+")'><span class='tx'><b>"+g.name+"</b><small>"+(l<=5?"Trial":l%10==0?"⚔ Boss level":"Asli game")+"</small></span><span class='pill'>Level "+l+"</span></button>"}).join(""):"<p class='sub'>Games jaldi aayenge</p>")+
 "<button class='ghost' onclick='history.back()'>‹ Peeche</button>");
}
function playMix(){
 if(!GAMES.length)return;
 push("type");
 play(rnd(0,GAMES.length-1));
}
function play(i){
 cur=GAMES[i];lvl=getLvl(cur);
 trial=lvl<=5;boss=!trial&&lvl%10==0;
 qTotal=trial?5:10;maxLives=trial?0:(boss?1:3);lives=maxLives;
 q=0;right=0;times=[];combo=0;bestCombo=0;xpGain=0;failed=false;busy=false;
 push("play");
 if(boss)sfx("boss");
 next();
}
function quit(){history.back()}
function hearts(){var h="";for(var i=0;i<maxLives;i++)h+=i<lives?"❤️":"🖤";return h}
function cmbText(){var m=combo>=5?3:combo>=3?2:1;return combo>=2?"🔥 "+combo+" combo"+(m>1?" · x"+m:""):""}
function next(){
 cq=cur.make(diff(lvl));
 var o=cq.opts.slice().sort(function(){return Math.random()-0.5});
 useT=timed||(!trial&&lvl>=20);
 ui("<div class='top'><b>"+cur.name+"</b><span class='pill'>"+(boss?"⚔ BOSS · ":"")+"Level "+lvl+(trial?" · Trial":"")+"</span></div>"+
 "<div class='hud'><span id='hh'>"+hearts()+"</span><span class='cmb' id='cc'>"+cmbText()+"</span></div>"+
 "<div class='prog'><i style='width:"+Math.round(q*100/qTotal)+"%'></i></div>"+
 (trial?"<div class='note'>🎓 Trial: lives nahi kategi, seekhte jao ("+(q+1)+"/"+qTotal+")</div>":"<div class='note'>Sawal "+(q+1)+"/"+qTotal+(boss?" · ⚔ Boss: sirf 1 life, double XP":"")+"</div>")+
 (useT?"<div class='bar'><i id='tb'></i></div><div id='tm'></div>":"")+
 "<div class='qcard'><div id='qt'>"+cq.text+"</div></div><div class='opts "+(o.length==4?"two":"")+"'>"+
 o.map(function(v,i){return "<button class='opt' style='--i:"+i+"' data-v='"+v+"' onclick='pick(this.dataset.v)'>"+v+"</button>"}).join("")+
 "</div><button class='ghost small' onclick='quit()'>✕ Chhodo</button>");
 t0=Date.now();
 if(useT){
  var total=Math.max(4,Math.round((trial?20:16)-diff(lvl)*0.09));
  if(boss)total=Math.max(4,Math.round(total*0.8));
  var left=total,tb=document.getElementById("tb");
  tb.style.transition="width "+total+"s linear";
  setTimeout(function(){tb.style.width="0%"},50);
  document.getElementById("tm").innerText="⏱ "+left+"s";
  tm=setInterval(function(){
   left--;
   var e=document.getElementById("tm");if(e)e.innerText="⏱ "+left+"s";
   if(left>0&&left<=3)sfx("tick");
   if(left<=0)pick(null);
  },1000);
 }
}
function pick(v){
 if(busy)return;busy=true;
 clearInterval(tm);
 times.push((Date.now()-t0)/1000);
 var ok=v!==null&&String(v)===String(cq.ans);
 if(ok){
  right++;combo++;if(combo>bestCombo)bestCombo=combo;
  xpGain+=10*(combo>=5?3:combo>=3?2:1)*(boss?2:1);
  sfx(combo>=3?"combo":"ok");vib(25);
 }else{
  combo=0;sfx("bad");vib(150);
  var qc=document.querySelector(".qcard");if(qc)qc.classList.add("shake");
  if(maxLives>0){lives--;if(lives<=0)failed=true}
 }
 var hh=document.getElementById("hh");if(hh)hh.innerText=hearts();
 var cc=document.getElementById("cc");if(cc)cc.innerText=cmbText();
 document.querySelectorAll(".opt").forEach(function(b){
  if(b.dataset.v===String(cq.ans))b.classList.add("ok");
  else if(b.dataset.v===v)b.classList.add("bad");
 });
 q++;
 setTimeout(function(){
  busy=false;
  if(scr!="play")return;
  if(failed||q>=qTotal)finish();else next();
 },ok?380:750);
}
function finish(){
 scr="end";
 var n=q,avg=(times.reduce(function(a,b){return a+b},0)/times.length).toFixed(1),slow=Math.max.apply(null,times).toFixed(1);
 var acc=Math.round(right*100/n);
 var up=trial?right>=4:!failed;
 var oldXp=num("mf_xp");
 if(up)xpGain+=boss?100:50;
 var newXp=oldXp+xpGain,rankUp=rankOf(newXp)>rankOf(oldXp);
 localStorage.setItem("mf_xp",newXp);
 localStorage.setItem("mf_played",num("mf_played")+1);
 localStorage.setItem("mf_qs",num("mf_qs")+n);
 localStorage.setItem("mf_right",num("mf_right")+right);
 if(up){localStorage.setItem(key(cur),lvl+1);localStorage.setItem("mf_passed",num("mf_passed")+1)}
 touchStreak();
 var st=!up?0:trial?(right==5?3:2):(lives>=maxLives?3:lives==maxLives-1?2:1),s="";
 for(var i=0;i<3;i++)s+=i<st?"★":"☆";
 var tip=acc<60?"Dheere aur dhyan se khelo, pehle accuracy badhao.":avg>7?"Jawab sahi hain, ab speed badhao.":"Zabardast! Ab combo lamba karo.";
 sfx(up?"win":"lose");vib(up?[60,40,60,40,120]:[200]);if(up)confetti();
 var title=up?(boss?"BOSS HARA DIYA! 👑":"Level Pass!"):(failed?"Lives khatam 💔":"Dobara Koshish");
 ui("<div class='stars'>"+s+"</div><div class='res'>"+title+"</div>"+(rankUp?"<div class='res'>🎉 RANK UP: "+RANKS[rankOf(newXp)][2]+" "+RANKS[rankOf(newXp)][0]+"</div>":"")+
 "<div class='grid'><div class='st' style='--i:0'><b>"+right+"/"+n+"</b><small>Sahi</small></div><div class='st' style='--i:1'><b>"+acc+"%</b><small>Accuracy</small></div><div class='st' style='--i:2'><b>"+avg+"s</b><small>Average time</small></div><div class='st' style='--i:3'><b>"+slow+"s</b><small>Sabse slow</small></div><div class='st' style='--i:4'><b>"+bestCombo+"🔥</b><small>Best combo</small></div><div class='st' style='--i:5'><b>+"+xpGain+"</b><small>XP</small></div></div>"+
 "<div class='tip'>💡 "+tip+"</div>"+
 "<div class='sub'>"+(up?"Agle level me aur mushkil sawal aayenge":trial?"Pass hone ke liye 4 sahi chahiye":"Is level me lives bachani hain")+"</div>"+
 "<button class='gold' onclick='play("+GAMES.indexOf(cur)+")'>"+(up?"Agla Level ›":"Dobara Try")+"</button>"+
 "<button class='ghost' onclick='history.back()'>Games list</button>");
}
</script>
